name: Build and Push Docker to ECR

on:
  push:
    branches:
      - rupesh   # Or change to your branch name

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 607700977843.dkr.ecr.us-east-2.amazonaws.com

      - name: Build Docker image
        run: |
          docker build -t strapi .

      - name: Tag Docker image
        run: |
          docker tag strapi:latest 607700977843.dkr.ecr.us-east-2.amazonaws.com/strapi-repo-rupesh:latest

      - name: Push Docker image to Amazon ECR
        run: |
          docker push 607700977843.dkr.ecr.us-east-2.amazonaws.com/strapi-repo-rupesh:latest
